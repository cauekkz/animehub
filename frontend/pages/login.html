<section class="auth">
    <div class="auth-art" aria-hidden="true" data-auth-art></div>

    <div class="auth-panel">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in</h1>
        <p class="muted">Pick up where you left off.</p>

        <form class="form" novalidate data-form>
            <div class="form-error" role="alert" hidden data-form-error></div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
                <p class="field-error" id="email-error" hidden></p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" class="reveal" aria-label="Show password" aria-pressed="false" data-reveal="password">Show</button>
                </div>
                <p class="field-error" id="password-error" hidden></p>
            </div>

            <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
        </form>

        <p class="auth-switch">No account yet? <a href="/signup" data-keep-next>Create account</a></p>
    </div>
</section>
