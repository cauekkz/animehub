<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0b0a">
    <meta name="description" content="AnimeHub: discover anime, keep track of what you are watching and find where to watch it officially.">
    <title>AnimeHub</title>
    <link rel="icon" href="/img/logo-black-mode.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://media.kitsu.app">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500&display=swap">
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="site-header" data-scrolled="false">
        <div class="header-row">
            <button class="icon-btn burger" type="button" aria-label="Open menu" aria-controls="drawer" aria-expanded="false" data-action="open-drawer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
            </button>

            <a href="/" class="brand" aria-label="AnimeHub, home">
                <img src="/img/logo-black-mode.png" alt="" width="613" height="407">
            </a>

            <nav class="main-nav" aria-label="Main">
                <a href="/" data-nav="home">Home</a>
                <a href="/catalog" data-nav="catalog">Catalog</a>
                <a href="/list" data-nav="list">My list</a>
            </nav>

            <form class="search" role="search" action="/catalog" data-search>
                <label class="sr-only" for="search-input">Search anime</label>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="search-input" name="q" type="search" placeholder="Search anime" autocomplete="off" enterkeyhint="search">
                <kbd aria-hidden="true">/</kbd>
            </form>

            <div class="account" data-account>
                <a class="btn btn-ghost btn-sm" href="/login" data-guest>Log in</a>
                <div class="account-menu" data-user hidden>
                    <button class="avatar" type="button" aria-haspopup="menu" aria-expanded="false" data-action="toggle-account">
                        <span data-user-initial>?</span>
                        <span class="sr-only">Open account menu</span>
                    </button>
                    <div class="menu" role="menu" hidden>
                        <p class="menu-head"><span data-user-name></span><small data-user-email></small></p>
                        <a role="menuitem" href="/list">My list</a>
                        <button role="menuitem" type="button" data-action="logout">Log out</button>
                    </div>
                </div>
            </div>
        </div>

        <nav class="genre-bar" aria-label="Genres">
            <ul data-genre-bar></ul>
        </nav>
    </header>

    <div class="drawer" id="drawer" hidden>
        <div class="drawer-scrim" data-action="close-drawer"></div>
        <aside class="drawer-panel" aria-label="Menu">
            <div class="drawer-top">
                <img src="/img/logo-black-mode.png" alt="AnimeHub" class="drawer-logo">
                <button class="icon-btn" type="button" aria-label="Close menu" data-action="close-drawer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <nav class="drawer-nav" aria-label="Mobile menu">
                <a href="/">Home</a>
                <a href="/catalog">Catalog</a>
                <a href="/list">My list</a>
            </nav>
            <p class="eyebrow">Genres</p>
            <ul class="drawer-genres" data-genre-list></ul>
            <div class="drawer-account">
                <div data-guest>
                    <a class="btn btn-primary btn-block" href="/login">Log in</a>
                    <a class="btn btn-ghost btn-block" href="/signup">Create account</a>
                </div>
                <div data-user hidden>
                    <p class="drawer-user"><span data-user-name></span><small data-user-email></small></p>
                    <button class="btn btn-ghost btn-block" type="button" data-action="logout">Log out</button>
                </div>
            </div>
        </aside>
    </div>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
        <p>Data from <a href="https://kitsu.app" target="_blank" rel="noopener">Kitsu</a>. Episodes are watched on the official platforms.</p>
        <p>AnimeHub, a school project</p>
    </footer>

    <dialog class="anime-modal" id="anime-modal" aria-labelledby="modal-title">
        <div class="modal-shell" data-modal-body></div>
    </dialog>

    <div class="toasts" aria-live="polite" aria-atomic="false" data-toasts></div>

    <script type="module" src="/js/app.js"></script>
</body>

</html>
